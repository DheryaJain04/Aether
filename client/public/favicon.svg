<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Background dark badge -->
  <rect width="100" height="100" rx="22" fill="#0B101D"/>

  <!-- Back of Orbit Ring -->
  <ellipse cx="50" cy="54" rx="42" ry="20" stroke="url(#ringGrad)" stroke-width="4.5" transform="rotate(-32 50 54)" stroke-dasharray="140 30" stroke-linecap="round"/>

  <!-- Capital 'A' Architectural Glyph -->
  <!-- Left leg -->
  <polygon points="50,22 43,30 22,82 32,82 45,50 50,38" fill="url(#aGrad)"/>
  <!-- Right leg -->
  <polygon points="50,22 57,30 78,82 68,82 55,50 50,38" fill="url(#aGrad)"/>
  <!-- Crossbar -->
  <polygon points="36,66 64,66 62,59 38,59" fill="#38BDF8"/>

  <!-- Front of Orbit Ring (Crossing over the A) -->
  <path d="M 18,68 A 42 20 0 0 0 78,46" stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round" transform="rotate(-32 50 54)"/>

  <!-- Guiding 4-pointed Star at Apex -->
  <!-- Vertical spark -->
  <polygon points="50,6 52,22 50,28 48,22" fill="#FFFFFF"/>
  <polygon points="50,14 58,22 50,30 42,22" fill="#38BDF8"/>
  <circle cx="50" cy="22" r="3" fill="#FFFFFF"/>
</svg>